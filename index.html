<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan Spesial Untukmu! 🎁</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 350px;
        }
        h1 { font-size: 24px; color: #ff6b6b; margin-top: 0; }
        p { font-size: 15px; margin-bottom: 25px; color: #666; }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        button:hover { background: #ff4757; transform: scale(1.05); }
        #content-area {
            margin-top: 25px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .quote {
            font-size: 20px;
            font-style: italic;
            color: #2f3542;
            font-weight: 600;
        }
        img { max-width: 100%; border-radius: 15px; }
        /* Tampilan iframe disesuaikan untuk Shorts */
        iframe { max-width: 100%; border-radius: 15px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Terima Kasih! 🎉</h1>
        <p>Sebagai tanda terima kasih karena telah membeli produk kami, silakan buka kejutan spesial di bawah ini!</p
        <br>
        <p>jangan lupa subrek btw🤭</p>
        
        <button id="btn-kejutan" onclick="tampilkanKejutan()">Buka Kejutan!</button>
        
        <div id="content-area">
            <!-- Kejutan akan muncul di sini -->
        </div>
    </div>

    <script>
        // DAFTAR KEJUTAN 
        const kejutan = [
            { tipe: 'quote', konten: '"Terima kasih sudah berbelanja! Semoga harimu menyenangkan dan rezekimu lancar terus! ✨"' },
            // Ini adalah 3 link YouTube Shorts milikmu yang sudah diubah formatnya agar bisa diputar di web:
            { tipe: 'youtube', konten: 'https://www.youtube.com/embed/rDbiqvC5ur0?autoplay=1' },
            { tipe: 'youtube', konten: 'https://www.youtube.com/embed/L9MNkttuU8I?autoplay=1' },
            { tipe: 'youtube', konten: 'https://www.youtube.com/embed/_2WheYbcaDE?autoplay=1' },
            // Gambar GIF lucunya tetap saya sisakan satu sebagai variasi:
            { tipe: 'gambar', konten: 'https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif' } 
        ];

        function tampilkanKejutan() {
            const area = document.getElementById('content-area');
            const btn = document.getElementById('btn-kejutan');
            
            // Efek loading saat tombol ditekan
            btn.innerText = "Mengacak...";
            btn.disabled = true;
            area.innerHTML = '<p>Mencari kejutan terbaik untukmu...</p>';

            setTimeout(() => {
                // Pilih secara acak dari daftar kejutan
                const acak = Math.floor(Math.random() * kejutan.length);
                const hasil = kejutan[acak];

                area.innerHTML = ''; // Bersihkan area
                
                if (hasil.tipe === 'quote') {
                    area.innerHTML = `<p class="quote">${hasil.konten}</p>`;
                } else if (hasil.tipe === 'youtube') {
                    // Karena video ini Shorts (vertikal), tinggi (height) diubah menjadi 400px agar proporsional
                    area.innerHTML = `<iframe width="100%" height="400" src="${hasil.konten}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                } else if (hasil.tipe === 'gambar') {
                    area.innerHTML = `<img src="${hasil.konten}" alt="Kejutan Gambar">`;
                }

                // Ubah teks tombol
                btn.innerText = "Coba Lagi!";
                btn.disabled = false;
            }, 1000); // Waktu tunggu 1 detik
        }
    </script>
</body>
</html>
